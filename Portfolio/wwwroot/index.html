<body>
    <div id="app">
        
        <div class="boot-screen">

                            cx="36"

                            cx="36" 
                            cy="44"

                    <circle class="gear-teeth"
                            cx="69"
                            cy="30"
                            r="13" 
                            stroke-dasharray="7 6.6" />

                            cx="69"
                            cy="30"

                            cx="69"
                            cy="30"
                            r="3.5" />

            </svg>
    
            <p class="boot-name">Bertrand Beaujard</p>
            <div class="boot-bar"></div>

    <div id="blazor-error-ui">
